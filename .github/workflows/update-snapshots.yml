name: Update visual baselines (Linux)

# Screenshot baselines are OS-specific (font rendering). Baselines for Windows are made locally; this job makes the
# Linux ones that CI compares against, and commits them back to the branch it was run on. Run it manually after an
# intentional UI change: Actions -> "Update visual baselines (Linux)" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/ui/quality.spec.ts --project=chromium --update-snapshots -g "visual baseline"
      - name: Commit new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          git diff --cached --quiet && echo "Baselines unchanged" && exit 0
          git commit -m "Update Linux visual baselines"
          git push
